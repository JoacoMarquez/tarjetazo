name: Scrapers

on:
  schedule:
    # 09:00 UTC = 06:00 en Uruguay. Diario, como fija docs/03-spec.md.
    # De paso mantiene despierto el proyecto de Supabase Free.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      fuente:
        description: Fuente a correr
        type: choice
        options: [todas, brou, santander, itau, oca, scotiabank, bbva]
        default: todas
      limite:
        description: Máximo de páginas a normalizar (vacío = todas)
        type: string

concurrency:
  group: scrapers
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Anotar inicio
        run: echo "INICIO=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Correr scraper
        id: scrapers
        working-directory: packages/scrapers
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FUENTE: ${{ inputs.fuente || 'todas' }}
          LIMITE: ${{ inputs.limite && format('--limite={0}', inputs.limite) || '' }}
        run: |
          # Sin input (el cron) o con "todas": una fuente por vez, y que la
          # caída de una no frene a las siguientes.
          if [ "$FUENTE" = "todas" ]; then fuentes="brou santander itau oca scotiabank bbva"; else fuentes="$FUENTE"; fi
          estado=0
          for f in $fuentes; do
            echo "=== $f ==="   | tee -a "$RUNNER_TEMP/reporte.txt"
            pnpm scrape "$f" $LIMITE 2>&1 | tee -a "$RUNNER_TEMP/reporte.txt" || estado=1
          done
          exit $estado

      # Siempre, haya fallado o no: si el mensaje no llega, esa es la alerta.
      # Las pruebas manuales con límite no mandan nada, para no llenar el chat.
      - name: Resumen a Telegram
        if: always() && (github.event_name == 'schedule' || inputs.limite == '')
        working-directory: packages/scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESUMEN_DESDE: ${{ env.INICIO }}
          RESUMEN_FUENTES: ${{ inputs.fuente || 'todas' }}
          RESUMEN_ESTADO: ${{ steps.scrapers.outcome }}
          RESUMEN_MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          RESUMEN_URL_LOG: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm scrape resumen

      - name: Reporte
        if: always()
        run: |
          {
            echo '### Corrida de scrapers'
            echo '```'
            cat "$RUNNER_TEMP/reporte.txt" 2>/dev/null || echo 'sin reporte (la corrida falló antes de terminar)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
