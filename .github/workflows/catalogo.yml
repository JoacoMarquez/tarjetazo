name: Catálogo de tarjetas

# Revisa las páginas oficiales de tarjetas de Santander, BROU y BBVA y deja
# sugerencias para la bandeja del backoffice (#27). Semanal: el catálogo
# cambia poco. "Revisar ahora" en el backoffice linkea acá.
on:
  schedule:
    # Lunes 12:00 UTC = 09:00 en Uruguay.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      fuente:
        description: Banco
        type: choice
        options: [todas, santander, brou, bbva]
        default: todas
      limite:
        description: Máximo de páginas por banco (vacío = todas)
        type: string

# El token de Actions solo lee el repo: los jobs manejan contenido de terceros
# y no necesitan escribir nada en GitHub.
permissions:
  contents: read

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    # Los secretos viven en el environment `produccion`, que solo acepta main:
    # un workflow_dispatch sobre otra rama no los recibe.
    environment: produccion
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Revisar catálogo
        working-directory: packages/scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # "1" para no gastar saldo de la API: las páginas que cambian quedan pendientes.
          SCRAPER_SIN_MODELO: ${{ vars.SCRAPER_SIN_MODELO }}
          FUENTE: ${{ inputs.fuente || 'todas' }}
          LIMITE: ${{ inputs.limite }}
        run: |
          [[ -z "$LIMITE" || "$LIMITE" =~ ^[0-9]+$ ]] || { echo "limite tiene que ser un número" >&2; exit 1; }
          pnpm scrape catalogo "$FUENTE" ${LIMITE:+"--limite=$LIMITE"}
