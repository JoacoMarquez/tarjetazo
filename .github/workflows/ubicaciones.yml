name: Ubicaciones de comercios

# Busca en OpenStreetMap los comercios sin sucursal en el mapa y deja
# sugerencias de ubicación para el backoffice (/admin/comercios). No escribe
# en `sucursal`: las acepta el operador. Semanal; lo que no apareció se vuelve
# a buscar recién a los 30 días.
on:
  schedule:
    # Martes 12:00 UTC = 09:00 en Uruguay.
    - cron: "0 12 * * 2"
  workflow_dispatch:
    inputs:
      limite:
        description: Máximo de comercios a buscar (vacío = todos los pendientes)
        type: string

# El token de Actions solo lee el repo: los jobs manejan contenido de terceros
# y no necesitan escribir nada en GitHub.
permissions:
  contents: read

concurrency:
  group: ubicaciones
  cancel-in-progress: false

jobs:
  sugerir:
    runs-on: ubuntu-latest
    # Los secretos viven en el environment `produccion`, que solo acepta main:
    # un workflow_dispatch sobre otra rama no los recibe.
    environment: produccion
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sugerir ubicaciones
        working-directory: packages/scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Por env y validado: un input interpolado en el script sería código.
          LIMITE: ${{ inputs.limite }}
        run: |
          [[ -z "$LIMITE" || "$LIMITE" =~ ^[0-9]+$ ]] || { echo "limite tiene que ser un número" >&2; exit 1; }
          pnpm geo sugerir ${LIMITE:+"$LIMITE"}
      # Teléfono, horario, sitio e Instagram de los locales ya vinculados a
      # OSM (#118), como sugerencias para el backoffice; no depende del paso anterior.
      - name: Info de comercios
        if: always()
        working-directory: packages/scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm geo info
